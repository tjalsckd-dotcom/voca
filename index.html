    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    const TYPE_ORDER = ["der", "die", "das", "Verb", "Adjektiv", "Ausdruck"];
    const TYPE_LABELS = {
      der: "DER", die: "DIE", das: "DAS",
      Verb: "VERB", Adjektiv: "ADJEKTIV", Ausdruck: "AUSDRUCK"
    };

    let session = null;
    let cards = [];
    let selectedId = null;
    let editingId = null;
    let selectedType = "all";
    let selectedTag = "all";
    let searchTerm = "";
    let busy = false;

    const $ = (id) => document.getElementById(id);

    function normalizeGerman(value) {
      return String(value || "").trim().toLowerCase().replace(/\s+/g, " ");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeCsv(value) {
      const text = Array.isArray(value) ? value.join(" | ") : String(value ?? "");
      return '"' + text.replaceAll('"', '""') + '"';
    }

    function parseTags(value) {
      return [...new Set(
        String(value || "")
          .split(/[,;\n]/)
          .map(tag => tag.trim())
          .filter(Boolean)
      )];
    }

    function showToast(message, isError = false) {
      const toast = $("toast");
      toast.textContent = message;
      toast.className = "toast show" + (isError ? " error" : "");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        toast.className = "toast";
      }, 3400);
    }

    function setAuthMessage(message, type = "") {
      const el = $("authMessage");
      el.textContent = message;
      el.className = "message" + (type ? " " + type : "");
    }

    function setBusy(value) {
      busy = value;
      document.querySelectorAll("button").forEach(button => {
        if (!button.dataset.alwaysEnabled) button.disabled = value;
      });
    }

    async function signIn() {
      const email = $("authEmail").value.trim();
      const password = $("authPassword").value;
      if (!email || !password) {
        setAuthMessage("이메일과 비밀번호를 모두 입력하세요.", "error");
        return;
      }
      setBusy(true);
      setAuthMessage("로그인 중...");
      const { error } = await db.auth.signInWithPassword({ email, password });
      setBusy(false);
      if (error) {
        setAuthMessage("로그인 실패: " + error.message, "error");
      }
    }

    async function signUp() {
      const email = $("authEmail").value.trim();
      const password = $("authPassword").value;
      if (!email || password.length < 6) {
        setAuthMessage("올바른 이메일과 6자 이상의 비밀번호를 입력하세요.", "error");
        return;
      }
      setBusy(true);
      setAuthMessage("회원가입 중...");
      const { data, error } = await db.auth.signUp({ email, password });
      setBusy(false);
      if (error) {
        setAuthMessage("회원가입 실패: " + error.message, "error");
        return;
      }
      if (data.session) {
        setAuthMessage("회원가입과 로그인이 완료되었습니다.", "success");
      } else {
        setAuthMessage("회원가입 요청이 완료되었습니다. 이메일 확인 링크를 누른 뒤 로그인하세요.", "success");
      }
    }

    async function signOut() {
      await db.auth.signOut();
    }

    async function handleSession(nextSession) {
      session = nextSession;
      const loggedIn = Boolean(session?.user);
      $("authView").classList.toggle("hidden", loggedIn);
      $("appView").classList.toggle("hidden", !loggedIn);
      $("logoutBtn").classList.toggle("hidden", !loggedIn);
      $("connectionPill").textContent = loggedIn ? session.user.email : "로그인 필요";

      if (loggedIn) {
        await loadCards();
      } else {
        cards = [];
        selectedId = null;
        renderAll();
      }
    }

    async function fetchAllCards() {
      const pageSize = 1000;
      let from = 0;
      let result = [];

      while (true) {
        const { data, error } = await db
          .from(TABLE)
          .select("*")
          .range(from, from + pageSize - 1);

        if (error) throw error;
        result = result.concat(data || []);
        if (!data || data.length < pageSize) break;
        from += pageSize;
      }
      return result;
    }

    async function loadCards() {
      if (!session) return;
      $("listStatus").textContent = "Supabase에서 불러오는 중...";
      try {
        cards = await fetchAllCards();
        if (selectedId && !cards.some(card => card.id === selectedId)) {
          selectedId = null;
        }
        renderAll();
        $("connectionPill").textContent = `${session.user.email} · ${cards.length}개`;
      } catch (error) {
        console.error(error);
        $("listStatus").textContent = "불러오기 실패";
        showToast("데이터를 불러오지 못했습니다: " + error.message, true);
      }
    }

    function getAllTags() {
      const counts = new Map();
      cards.forEach(card => {
        (card.tags || []).forEach(tag => counts.set(tag, (counts.get(tag) || 0) + 1));
      });
      return [...counts.entries()].sort((a, b) => a[0].localeCompare(b[0], "ko"));
    }

    function filteredCards() {
      let result = cards.filter(card => {
        if (selectedType !== "all" && card.word_type !== selectedType) return false;
        if (selectedTag !== "all" && !(card.tags || []).includes(selectedTag)) return false;

        if (searchTerm) {
          const haystack = [
            card.german, card.meaning, card.extra2,
            card.example_de, card.example_translation,
            card.notes, ...(card.tags || [])
          ].join(" ").toLowerCase();
          if (!haystack.includes(searchTerm)) return false;
        }
        return true;
      });

      const sort = $("sortSelect")?.value || "german-asc";
      result.sort((a, b) => {
        if (sort === "german-desc") return b.german.localeCompare(a.german, "de");
        if (sort === "newest") return new Date(b.created_at) - new Date(a.created_at);
        if (sort === "updated") return new Date(b.updated_at) - new Date(a.updated_at);
        return a.german.localeCompare(b.german, "de");
      });
      return result;
    }

    function renderTypeFilters() {
      const container = $("typeFilters");
      const counts = Object.fromEntries(TYPE_ORDER.map(type => [type, 0]));
      cards.forEach(card => {
        if (counts[card.word_type] !== undefined) counts[card.word_type]++;
      });

      const buttons = [
        `<button class="filter-button ${selectedType === "all" ? "active" : ""}" data-type="all">
          <span>전체</span><span class="count">${cards.length}</span>
        </button>`
      ];
      TYPE_ORDER.forEach(type => {
        buttons.push(`<button class="filter-button ${selectedType === type ? "active" : ""}" data-type="${escapeHtml(type)}">
          <span><span class="badge ${escapeHtml(type)}">${TYPE_LABELS[type]}</span></span>
          <span class="count">${counts[type]}</span>
        </button>`);
      });
      container.innerHTML = buttons.join("");
      container.querySelectorAll("[data-type]").forEach(button => {
        button.addEventListener("click", () => {
          selectedType = button.dataset.type;
          renderAll();
        });
      });
    }

    function renderTagFilters() {
      const tags = getAllTags();
      const container = $("tagFilters");
      const buttons = [
        `<button class="filter-button ${selectedTag === "all" ? "active" : ""}" data-tag="all">
          <span>모든 태그</span><span class="count">${cards.length}</span>
        </button>`
      ];
      tags.forEach(([tag, count]) => {
        buttons.push(`<button class="filter-button ${selectedTag === tag ? "active" : ""}" data-tag="${escapeHtml(tag)}">
          <span><span class="tag-dot"></span>${escapeHtml(tag)}</span>
          <span class="count">${count}</span>
        </button>`);
      });
      container.innerHTML = buttons.join("");
      container.querySelectorAll("[data-tag]").forEach(button => {
        button.addEventListener("click", () => {
          selectedTag = button.dataset.tag;
          renderAll();
        });
      });

      $("tagSuggestions").innerHTML = tags
        .map(([tag]) => `<option value="${escapeHtml(tag)}"></option>`)
        .join("");
    }

    function renderList() {
      const result = filteredCards();
      const titleParts = [];
      if (selectedType !== "all") titleParts.push(TYPE_LABELS[selectedType]);
      if (selectedTag !== "all") titleParts.push("#" + selectedTag);
      $("listTitle").textContent = titleParts.length ? titleParts.join(" · ") : "전체 단어";
      $("listStatus").textContent = `${result.length}개 표시 · 전체 ${cards.length}개`;

      const container = $("cardList");
      if (!result.length) {
        container.innerHTML = `<div class="detail-empty" style="min-height:240px">조건에 맞는 단어가 없습니다.</div>`;
        return;
      }

      container.innerHTML = result.map(card => `
        <article class="card-row ${selectedId === card.id ? "active" : ""}" data-id="${escapeHtml(card.id)}">
          <div class="card-row-title">
            <span class="badge ${escapeHtml(card.word_type)}">${TYPE_LABELS[card.word_type] || escapeHtml(card.word_type)}</span>
            <span>${escapeHtml(card.german)}</span>
          </div>
          <div class="card-row-meaning">${escapeHtml(card.meaning || "뜻 없음")}</div>
          ${(card.tags || []).length ? `<div class="chips">${
            card.tags.slice(0, 4).map(tag => `<button class="chip" data-chip-tag="${escapeHtml(tag)}">#${escapeHtml(tag)}</button>`).join("")
          }</div>` : ""}
        </article>
      `).join("");

      container.querySelectorAll(".card-row").forEach(row => {
        row.addEventListener("click", event => {
          const chip = event.target.closest("[data-chip-tag]");
          if (chip) {
            event.stopPropagation();
            selectedTag = chip.dataset.chipTag;
            renderAll();
            return;
          }
          selectedId = row.dataset.id;
          editingId = null;
          renderAll();
          openDetailOnMobile();
        });
      });
    }

    function currentCard() {
      return cards.find(card => card.id === selectedId) || null;
    }

    function renderDetail() {
      const container = $("detailContent");
      const card = currentCard();

      if (editingId !== null) {
        renderEditor(editingId ? cards.find(item => item.id === editingId) : null);
        return;
      }

      if (!card) {
        container.className = "detail-empty";
        container.innerHTML = "왼쪽 목록에서 단어를 선택하거나 새 단어를 추가하세요.";
        return;
      }

      container.className = "";
      container.innerHTML = `
        <article class="detail-card">
          <div class="detail-head">
            <h2 class="detail-title">${escapeHtml(card.german)}</h2>
            <span class="badge ${escapeHtml(card.word_type)}">${TYPE_LABELS[card.word_type] || escapeHtml(card.word_type)}</span>
            ${card.extra2 ? `<div class="detail-extra"><strong>추가 정보:</strong><br>${escapeHtml(card.extra2)}</div>` : ""}
            ${(card.tags || []).length ? `<div class="chips">${
              card.tags.map(tag => `<button class="chip" data-detail-tag="${escapeHtml(tag)}">#${escapeHtml(tag)}</button>`).join("")
            }</div>` : ""}
          </div>
          <div class="detail-body">
            <div class="detail-section">
              <div class="detail-label">뜻</div>
              <div class="detail-value">${escapeHtml(card.meaning || "—")}</div>
            </div>
            <div class="detail-section">
              <div class="detail-label">예문</div>
              <div class="detail-value">${escapeHtml(card.example_de || "—")}</div>
            </div>
            <div class="detail-section">
              <div class="detail-label">예문 해석</div>
              <div class="detail-value">${escapeHtml(card.example_translation || "—")}</div>
            </div>
            ${card.notes ? `<div class="detail-section">
              <div class="detail-label">메모</div>
              <div class="detail-value">${escapeHtml(card.notes)}</div>
            </div>` : ""}
            <div class="detail-actions">
              <button id="editCardBtn" class="btn primary">수정</button>
              <button id="deleteCardBtn" class="btn danger">삭제</button>
            </div>
          </div>
        </article>
      `;

      $("editCardBtn").addEventListener("click", () => {
        editingId = card.id;
        renderDetail();
      });
      $("deleteCardBtn").addEventListener("click", deleteSelectedCard);
      container.querySelectorAll("[data-detail-tag]").forEach(button => {
        button.addEventListener("click", () => {
          selectedTag = button.dataset.detailTag;
          closeDetailOnMobile();
          renderAll();
        });
      });
    }

    function renderEditor(card) {
      const container = $("detailContent");
      const isNew = !card;
      container.className = "";
      container.innerHTML = `
        <div class="editor-wrap">
          <form id="cardForm" class="editor">
            <h2>${isNew ? "새 단어" : "단어 수정"}</h2>
            <div class="grid-2">
              <div class="field">
                <label for="editGerman">Deutsch *</label>
                <input id="editGerman" required value="${escapeHtml(card?.german || "")}" placeholder="예: das Urlaubsziel">
              </div>
              <div class="field">
                <label for="editType">품사 *</label>
                <select id="editType" required>
                  ${TYPE_ORDER.map(type => `<option value="${type}" ${card?.word_type === type ? "selected" : ""}>${TYPE_LABELS[type]}</option>`).join("")}
                </select>
              </div>
            </div>
            <div class="field">
              <label for="editExtra2">Extra2</label>
              <input id="editExtra2" value="${escapeHtml(card?.extra2 || "")}" placeholder="명사: die Urlaubsziele / 동사: entschloss / entschlossen">
            </div>
            <div class="field">
              <label for="editMeaning">스페인어 뜻</label>
              <input id="editMeaning" value="${escapeHtml(card?.meaning || "")}" placeholder="el destino de vacaciones">
            </div>
            <div class="field">
              <label for="editExampleDe">독일어 예문</label>
              <textarea id="editExampleDe">${escapeHtml(card?.example_de || "")}</textarea>
            </div>
            <div class="field">
              <label for="editExampleTranslation">스페인어 예문 해석</label>
              <textarea id="editExampleTranslation">${escapeHtml(card?.example_translation || "")}</textarea>
            </div>
            <div class="field">
              <label for="editTags">태그</label>
              <input id="editTags" list="tagSuggestions" value="${escapeHtml((card?.tags || []).join(", "))}" placeholder="여행, 수업, 뉴스">
              <div class="hint">쉼표로 여러 태그를 구분하세요.</div>
            </div>
            <div class="field">
              <label for="editNotes">메모</label>
              <textarea id="editNotes">${escapeHtml(card?.notes || "")}</textarea>
            </div>
            <div class="editor-actions">
              <button type="button" id="cancelEditBtn" class="btn">취소</button>
              <button type="submit" class="btn primary">${isNew ? "저장" : "변경 저장"}</button>
            </div>
          </form>
        </div>
      `;
      $("cancelEditBtn").addEventListener("click", () => {
        editingId = null;
        if (isNew) selectedId = null;
        renderDetail();
      });
      $("cardForm").addEventListener("submit", saveEditor);
    }

    async function saveEditor(event) {
      event.preventDefault();
      if (busy) return;

      const german = $("editGerman").value.trim();
      const normalized = normalizeGerman(german);
      if (!german) {
        showToast("독일어 표제어를 입력하세요.", true);
        return;
      }

      const duplicate = cards.find(card =>
        card.id !== editingId && normalizeGerman(card.german) === normalized
      );
      if (duplicate) {
        showToast(`이미 등록된 단어입니다: ${duplicate.german}`, true);
        return;
      }

      const payload = {
        german,
        normalized_german: normalized,
        word_type: $("editType").value,
        extra2: $("editExtra2").value.trim(),
        meaning: $("editMeaning").value.trim(),
        example_de: $("editExampleDe").value.trim(),
        example_translation: $("editExampleTranslation").value.trim(),
        tags: parseTags($("editTags").value),
        notes: $("editNotes").value.trim()
      };

      setBusy(true);
      try {
        const wasEditing = Boolean(editingId);
        let response;
        if (editingId) {
          response = await db
            .from(TABLE)
            .update(payload)
            .eq("id", editingId)
            .select()
            .single();
        } else {
          response = await db
            .from(TABLE)
            .insert(payload)
            .select()
            .single();
        }
        if (response.error) throw response.error;

        selectedId = response.data.id;
        editingId = null;
        await loadCards();
        showToast(wasEditing ? "수정했습니다." : "저장했습니다.");
      } catch (error) {
        console.error(error);
        const message = String(error.message || error);
        if (message.includes("german_vocab_cards_unique_word") || message.includes("duplicate key")) {
          showToast("같은 단어가 이미 등록되어 있습니다.", true);
        } else {
          showToast("저장 실패: " + message, true);
        }
      } finally {
        setBusy(false);
      }
    }

    async function deleteSelectedCard() {
      const card = currentCard();
      if (!card) return;
      if (!confirm(`“${card.german}”을 삭제할까요?`)) return;

      setBusy(true);
      const { error } = await db.from(TABLE).delete().eq("id", card.id);
      setBusy(false);
      if (error) {
        showToast("삭제 실패: " + error.message, true);
        return;
      }
      selectedId = null;
      await loadCards();
      showToast("삭제했습니다.");
    }

    async function importSeedCards() {
      if (!session?.user || busy) return;
      if (!confirm(`기존 단어 ${SEED_CARDS.length}개 중 현재 계정에 없는 단어만 가져올까요?`)) return;

      setBusy(true);
      try {
        const existing = new Set(cards.map(card => normalizeGerman(card.german)));
        const pending = SEED_CARDS
          .filter(card => !existing.has(card.normalized_german))
          .map(card => ({
            ...card,
            user_id: session.user.id
          }));

        if (!pending.length) {
          showToast("가져올 새 단어가 없습니다.");
          return;
        }

        const chunkSize = 75;
        for (let i = 0; i < pending.length; i += chunkSize) {
          const chunk = pending.slice(i, i + chunkSize);
          $("connectionPill").textContent = `가져오는 중 ${Math.min(i + chunk.length, pending.length)}/${pending.length}`;
          const { error } = await db.from(TABLE).insert(chunk);
          if (error) throw error;
        }

        await loadCards();
        showToast(`${pending.length}개 단어를 가져왔습니다.`);
      } catch (error) {
        console.error(error);
        showToast("가져오기 실패: " + error.message, true);
      } finally {
        setBusy(false);
        if (session) $("connectionPill").textContent = `${session.user.email} · ${cards.length}개`;
      }
    }

    function downloadFile(filename, content, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = filename;
      anchor.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportJson() {
      const payload = {
        exported_at: new Date().toISOString(),
        table: TABLE,
        row_count: cards.length,
        rows: cards
      };
      downloadFile(
        `german_vocab_backup_${new Date().toISOString().slice(0, 10)}.json`,
        JSON.stringify(payload, null, 2),
        "application/json;charset=utf-8"
      );
    }

    function exportCsv() {
      const headers = [
        "german", "word_type", "extra2", "meaning",
        "example_de", "example_translation", "notes", "tags",
        "created_at", "updated_at"
      ];
      const lines = [headers.map(escapeCsv).join(",")];
      cards.forEach(card => {
        lines.push(headers.map(header => escapeCsv(card[header])).join(","));
      });
      downloadFile(
        `german_vocab_backup_${new Date().toISOString().slice(0, 10)}.csv`,
        "\uFEFF" + lines.join("\n"),
        "text/csv;charset=utf-8"
      );
    }

    function renderAll() {
      renderTypeFilters();
      renderTagFilters();
      renderList();
      renderDetail();
    }

    function openDetailOnMobile() {
      if (window.innerWidth <= 980) {
        $("detailPane").classList.add("mobile-open");
        $("closeDetailBtn").classList.remove("hidden");
      }
    }

    function closeDetailOnMobile() {
      $("detailPane").classList.remove("mobile-open");
      $("closeDetailBtn").classList.add("hidden");
    }

    $("signInBtn").addEventListener("click", signIn);
    $("signUpBtn").addEventListener("click", signUp);
    $("logoutBtn").addEventListener("click", signOut);
    $("newCardBtn").addEventListener("click", () => {
      selectedId = null;
      editingId = "";
      renderDetail();
      openDetailOnMobile();
    });
    $("searchInput").addEventListener("input", event => {
      searchTerm = event.target.value.trim().toLowerCase();
      renderList();
    });
    $("sortSelect").addEventListener("change", renderList);
    $("importSeedBtn").addEventListener("click", importSeedCards);
    $("exportJsonBtn").addEventListener("click", exportJson);
    $("exportCsvBtn").addEventListener("click", exportCsv);
    $("refreshBtn").addEventListener("click", loadCards);
    $("closeDetailBtn").addEventListener("click", closeDetailOnMobile);

    db.auth.onAuthStateChange((_event, nextSession) => {
      handleSession(nextSession);
    });

    (async () => {
      const { data } = await db.auth.getSession();
      await handleSession(data.session);
    })();
  </script>
</body>
</html>
